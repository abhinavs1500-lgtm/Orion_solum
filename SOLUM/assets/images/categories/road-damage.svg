<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="roadBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="url(#roadBg)"/>

  <!-- Asphalt road perspective -->
  <polygon points="120,60 280,60 380,220 20,220" fill="#334155"/>
  <!-- Road divider -->
  <line x1="200" y1="65" x2="200" y2="215" stroke="#f8fafc" stroke-width="3" stroke-dasharray="15,15"/>

  <!-- Pothole / Road cave-in -->
  <ellipse cx="140" cy="165" rx="45" ry="22" fill="#0f172a"/>
  <!-- Fracture cracks -->
  <path d="M 95 165 L 70 175 M 185 165 L 215 155 M 130 187 L 120 205 M 150 143 L 155 125" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Traffic safety cone -->
  <polygon points="260,195 285,195 277,145 268,145" fill="#f97316"/>
  <rect x="255" y="195" width="35" height="6" rx="2" fill="#ea580c"/>
  <polygon points="266,160 279,160 276,170 269,170" fill="#f8fafc"/>
  <polygon points="263,180 282,180 280,188 265,188" fill="#f8fafc"/>

  <!-- Badge -->
  <rect x="25" y="25" width="180" height="30" rx="6" fill="#ea580c"/>
  <text x="35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">🚧 ROAD DAMAGE</text>
  <text x="25" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c2410c">Pothole · Shoulder erosion · Asphalt collapse</text>
</svg>