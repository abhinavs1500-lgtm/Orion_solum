<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="waterBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="floodWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="url(#waterBg)"/>

  <!-- Submerged street buildings in background -->
  <rect x="50" y="80" width="60" height="90" rx="3" fill="#cbd5e1"/>
  <rect x="130" y="60" width="80" height="110" rx="3" fill="#94a3b8"/>
  <rect x="230" y="90" width="70" height="80" rx="3" fill="#cbd5e1"/>
  <rect x="320" y="70" width="50" height="100" rx="3" fill="#94a3b8"/>

  <!-- Inundated street / water level -->
  <path d="M 0 160 Q 100 150 200 160 T 400 155 L 400 260 L 0 260 Z" fill="url(#floodWater)"/>
  
  <!-- Water ripples -->
  <path d="M 40 185 Q 90 180 140 185 M 180 205 Q 260 200 340 205 M 80 225 Q 160 220 240 225" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Submerged car silhouette -->
  <g fill="#1e293b" opacity="0.8">
    <path d="M 230 180 Q 240 165 260 165 L 290 165 Q 310 165 320 180 L 330 185 L 220 185 Z"/>
    <circle cx="245" cy="185" r="8" fill="#475569"/>
    <circle cx="305" cy="185" r="8" fill="#475569"/>
  </g>

  <!-- Water depth gauge stake -->
  <rect x="70" y="110" width="10" height="85" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="70" y1="130" x2="80" y2="130" stroke="#b91c1c" stroke-width="2"/>
  <line x1="70" y1="150" x2="80" y2="150" stroke="#b91c1c" stroke-width="2"/>
  <line x1="70" y1="170" x2="80" y2="170" stroke="#b91c1c" stroke-width="2"/>

  <!-- Badge -->
  <rect x="25" y="25" width="180" height="30" rx="6" fill="#0284c7"/>
  <text x="35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">🌊 WATERLOGGING</text>
  <text x="25" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0369a1">Flooded street · Stagnant runoff · Access cut</text>
</svg>