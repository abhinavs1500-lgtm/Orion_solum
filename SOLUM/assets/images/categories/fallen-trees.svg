<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="treeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="url(#treeBg)"/>

  <!-- Road roadway -->
  <rect x="0" y="150" width="400" height="70" fill="#475569"/>
  <line x1="20" y1="185" x2="380" y2="185" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="16,16"/>

  <!-- Uprooted tree trunk across road -->
  <g transform="rotate(25 200 160)">
    <!-- Root ball -->
    <ellipse cx="60" cy="160" rx="28" ry="24" fill="#78350f"/>
    <!-- Exposed roots -->
    <path d="M 40 150 Q 25 140 15 155 M 45 170 Q 30 185 20 180 M 55 180 Q 45 200 35 195" stroke="#451a03" stroke-width="3" fill="none"/>
    <!-- Trunk -->
    <rect x="75" y="150" width="180" height="22" rx="4" fill="#854d0e"/>
    <rect x="180" y="130" width="40" height="12" rx="2" fill="#713f12" transform="rotate(-30 180 130)"/>
    <!-- Canopy foliage -->
    <circle cx="270" cy="155" r="35" fill="#15803d"/>
    <circle cx="295" cy="140" r="28" fill="#16a34a"/>
    <circle cx="310" cy="165" r="32" fill="#14532d"/>
  </g>

  <!-- Caution barrier -->
  <g stroke="#eab308" stroke-width="5" stroke-linecap="round">
    <line x1="260" y1="190" x2="340" y2="190"/>
    <line x1="270" y1="190" x2="270" y2="215" stroke-width="3"/>
    <line x1="330" y1="190" x2="330" y2="215" stroke-width="3"/>
  </g>

  <!-- Badge -->
  <rect x="25" y="25" width="180" height="30" rx="6" fill="#15803d"/>
  <text x="35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">🌳 FALLEN TREE / DEBRIS</text>
  <text x="25" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#14532d">Uprooted trunk · Road blockage · Tangled cables</text>
</svg>