<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="infraBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="url(#infraBg)"/>

  <!-- Bridge or culvert parapet -->
  <rect x="40" y="90" width="320" height="40" rx="4" fill="#64748b"/>
  <!-- Broken section in bridge railing -->
  <polygon points="160,90 220,90 205,130 175,130" fill="url(#infraBg)"/>
  <!-- Damaged rebar showing -->
  <line x1="175" y1="100" x2="190" y2="108" stroke="#dc2626" stroke-width="2"/>
  <line x1="180" y1="115" x2="195" y2="120" stroke="#dc2626" stroke-width="2"/>

  <!-- Concrete piers -->
  <rect x="70" y="130" width="35" height="85" fill="#475569"/>
  <rect x="295" y="130" width="35" height="85" fill="#475569"/>

  <!-- Utility pipe running along bridge with rupture / spray -->
  <rect x="30" y="145" width="340" height="12" rx="3" fill="#0284c7"/>
  <!-- Water leak spray -->
  <path d="M 190 145 Q 180 125 170 120 M 190 145 Q 200 120 215 115 M 190 145 Q 195 125 185 110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Danger tape / caution -->
  <line x1="130" y1="105" x2="250" y2="105" stroke="#eab308" stroke-width="4" stroke-dasharray="10,10"/>

  <!-- Badge -->
  <rect x="25" y="25" width="200" height="30" rx="6" fill="#6d28d9"/>
  <text x="35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">🏛️ PUBLIC INFRASTRUCTURE</text>
  <text x="25" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5b21b6">Bridge damage · Water main leak · Wall collapse</text>
</svg>