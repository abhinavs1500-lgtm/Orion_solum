<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="gridSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#gridSky)"/>

  <!-- High-voltage transmission towers -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none">
    <!-- Center tower -->
    <line x1="285" y1="320" x2="300" y2="100"/>
    <line x1="315" y1="320" x2="300" y2="100"/>
    <line x1="280" y1="160" x2="320" y2="160"/>
    <line x1="270" y1="210" x2="330" y2="210"/>
    <line x1="260" y1="265" x2="340" y2="265"/>
    <line x1="288" y1="265" x2="312" y2="210"/>
    <line x1="312" y1="265" x2="288" y2="210"/>
    <line x1="293" y1="210" x2="307" y2="160"/>
    <line x1="307" y1="210" x2="293" y2="160"/>

    <!-- Left tower -->
    <line x1="85" y1="320" x2="100" y2="150"/>
    <line x1="115" y1="320" x2="100" y2="150"/>
    <line x1="80" y1="200" x2="120" y2="200"/>
    <line x1="75" y1="250" x2="125" y2="250"/>

    <!-- Right tower -->
    <line x1="485" y1="320" x2="500" y2="150"/>
    <line x1="515" y1="320" x2="500" y2="150"/>
    <line x1="480" y1="200" x2="520" y2="200"/>
    <line x1="475" y1="250" x2="525" y2="250"/>
  </g>

  <!-- Power lines catenary curves -->
  <path d="M 0 140 Q 100 170 270 160 Q 300 160 480 200 T 600 180" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M 0 190 Q 100 220 260 210 Q 300 210 475 250 T 600 230" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.85"/>

  <!-- Substation transformer yard -->
  <rect x="230" y="270" width="140" height="50" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="260" cy="295" r="12" fill="#0284c7"/>
  <circle cx="300" cy="295" r="12" fill="#0284c7"/>
  <circle cx="340" cy="295" r="12" fill="#0284c7"/>

  <!-- Energy pulse glow -->
  <circle cx="300" cy="100" r="6" fill="#38bdf8"/>
  <circle cx="300" cy="100" r="14" fill="#38bdf8" opacity="0.3"/>

  <!-- Badge -->
  <rect x="25" y="25" width="220" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="45" cy="42" r="6" fill="#f59e0b"/>
  <text x="60" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fde68a">POWER SUBSTATION &amp; GRID RESILIENCE</text>

  <rect x="420" y="315" width="155" height="26" rx="6" fill="#020617" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="432" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">TANGEDCO Feeder System</text>
</svg>